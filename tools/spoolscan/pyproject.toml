[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spoolscan"
version = "0.2.0"
description = "Read-only NFC/RFID filament spool tag scanner (Bambu, Snapmaker, Creality, QIDI, Anycubic, Elegoo, OpenSpool, TigerTag) that emits JSON"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["pyscard>=2.0", "cryptography>=41"]

[project.optional-dependencies]
test = ["pytest", "pyyaml"]

[project.scripts]
spoolscan = "spoolscan.cli:main"

[tool.setuptools.packages.find]
include = ["spoolscan*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "LICENSE", "VENDORED.txt"]
